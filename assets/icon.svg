<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Grotesk:wght@500;600;700;900&amp;family=Syne:wght@800;900&amp;display=swap');

      /* Color Palette */
      .bg-cream { fill: #F5EFEB; }
      .fill-black { fill: #121212; }
      .fill-red { fill: #D92323; }
      .fill-cream { fill: #F5EFEB; }

      .stroke-black { stroke: #121212; }
      .stroke-red { stroke: #D92323; }
      .stroke-cream { stroke: #F5EFEB; }
      .stroke-guide { stroke: #DCD4C5; }

      /* Typography */
      .font-display {
        font-family: 'Syne', 'Anton', 'Impact', 'Arial Black', -apple-system, sans-serif;
        font-weight: 900;
        text-rendering: geometricPrecision;
      }
      .font-sub {
        font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        text-rendering: geometricPrecision;
      }
      .font-mono {
        font-family: 'Space Grotesk', 'Consolas', 'Courier New', monospace;
        text-rendering: geometricPrecision;
      }
    </style>

    <!-- Clip Paths for Geometric Color Inversion -->
    <!-- The Cream Upper Wedge Zone -->
    <clipPath id="clip-cream-zone">
      <polygon points="0,0 1000,0 1000,260 0,520" />
    </clipPath>

    <!-- The Carbon Black Lower Monolith Zone -->
    <clipPath id="clip-black-zone">
      <polygon points="0,520 1000,260 1000,1000 0,1000" />
    </clipPath>

    <!-- The Red Celestial / Industrial Disc Zone -->
    <clipPath id="clip-red-disc">
      <circle cx="680" cy="380" r="260" />
    </clipPath>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. BASE BACKGROUND & CONSTRUCTIVIST ARCHITECTURAL GRID   -->
  <!-- ======================================================== -->

  <!-- Base warm archival cream canvas -->
  <rect width="1000" height="1000" class="bg-cream" />

  <!-- Technical Grid Guidelines -->
  <g class="stroke-guide" stroke-width="1" opacity="0.6">
    <!-- Vertical guide axes -->
    <line x1="70" y1="0" x2="70" y2="1000" />
    <line x1="180" y1="0" x2="180" y2="1000" />
    <line x1="380" y1="0" x2="380" y2="1000" />
    <line x1="680" y1="0" x2="680" y2="1000" />
    <line x1="930" y1="0" x2="930" y2="1000" />

    <!-- Horizontal guide axes -->
    <line x1="0" y1="70" x2="1000" y2="70" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="440" x2="1000" y2="440" />
    <line x1="0" y1="750" x2="1000" y2="750" />
    <line x1="0" y1="930" x2="1000" y2="930" />

    <!-- 45-degree and dynamic perspective guide lines -->
    <line x1="0" y1="520" x2="1000" y2="260" stroke="#C8BFAD" stroke-width="1.5" stroke-dasharray="6 4" />
    <line x1="180" y1="1000" x2="1000" y2="180" stroke-dasharray="4 6" opacity="0.4" />
  </g>

  <!-- Dot Matrix Technical Grid Accents -->
  <g class="fill-black" opacity="0.2">
    <circle cx="70" cy="70" r="2.5" />
    <circle cx="180" cy="70" r="2.5" />
    <circle cx="380" cy="70" r="2.5" />
    <circle cx="680" cy="70" r="2.5" />
    <circle cx="930" cy="70" r="2.5" />
    <circle cx="70" cy="160" r="2.5" />
    <circle cx="70" cy="440" r="2.5" />
    <circle cx="70" cy="750" r="2.5" />
    <circle cx="70" cy="930" r="2.5" />
    <circle cx="930" cy="930" r="2.5" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. PRIMARY GEOMETRIC COLOR FIELDS & MASSES               -->
  <!-- ======================================================== -->

  <!-- Giant Crimson Red Disc (Revolutionary / Celestial Weight) -->
  <circle cx="680" cy="380" r="260" class="fill-red" />

  <!-- Concentric Orbit Ring -->
  <circle cx="680" cy="380" r="290" fill="none" class="stroke-black" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Diagonal Crimson Red Beam slicing upward -->
  <polygon points="340,0 440,0 240,1000 140,1000" class="fill-red" />

  <!-- Monumental Diagonal Carbon Black Polygonal Field (Lower 60%) -->
  <polygon points="0,520 1000,260 1000,1000 0,1000" class="fill-black" />

  <!-- Left Vertical Structural Spine Bar -->
  <rect x="70" y="0" width="14" height="1000" class="fill-black" />
  <rect x="92" y="160" width="4" height="680" class="fill-red" />

  <!-- Upper Left Section Badge -->
  <g>
    <rect x="70" y="70" width="110" height="26" class="fill-black" />
    <text x="80" y="88" class="font-mono" font-size="11" font-weight="700" fill="#F5EFEB" letter-spacing="0.22em">VOL. I</text>
    <rect x="180" y="70" width="26" height="26" class="fill-red" />
    <text x="193" y="88" class="font-mono" font-size="13" font-weight="900" fill="#F5EFEB" text-anchor="middle">§</text>
  </g>

  <!-- Precision Crosshairs & Alignment Indices -->
  <g class="stroke-black" stroke-width="1.5">
    <line x1="910" y1="70" x2="950" y2="70" />
    <line x1="930" y1="50" x2="930" y2="90" />
    <circle cx="930" cy="70" r="6" fill="none" class="stroke-black" />
  </g>

  <!-- ======================================================== -->
  <!-- 3. SECONDARY TYPOGRAPHY & HEADER HIERARCHY               -->
  <!-- ======================================================== -->

  <!-- Subtitle Metadata in Cream Zone -->
  <g>
    <text x="220" y="108" class="font-sub fill-black" font-size="15" letter-spacing="0.32em">A CRITIQUE OF POLITICAL ECONOMY</text>
    <text x="220" y="132" class="font-mono fill-red" font-size="11" font-weight="700" letter-spacing="0.24em">BOOK I · THE PROCESS OF CAPITALIST PRODUCTION</text>
    <line x1="220" y1="144" x2="620" y2="144" class="stroke-black" stroke-width="2.5" />
  </g>

  <!-- Archival Publication Lineage (Top Right in Cream) -->
  <g class="font-mono" opacity="0.85">
    <text x="930" y="112" class="fill-black" font-size="10" font-weight="700" text-anchor="end" letter-spacing="0.2em">HAMBURG 1867 // LONDON 1887</text>
    <text x="930" y="130" class="fill-red" font-size="9" font-weight="600" text-anchor="end" letter-spacing="0.16em">CRITICAL TYPOGRAPHIC EDITION</text>
  </g>

  <!-- ======================================================== -->
  <!-- 4. CORE HEROIC TYPOGRAPHY: "CAPITAL"                     -->
  <!-- Dissected, Staggered, and Inverted across Color Fields    -->
  <!-- ======================================================== -->

  <!-- PASS A: UPPER ZONE (Cream Field) -->
  <g clip-path="url(#clip-cream-zone)" class="font-display">
    <!-- 'C' - Colossal curvature in deep black -->
    <text x="110" y="450" font-size="330" class="fill-black" letter-spacing="-0.05em">C</text>

    <!-- 'A' - First 'A' in vibrant crimson red against cream -->
    <text x="350" y="420" font-size="270" class="fill-red" letter-spacing="-0.03em">A</text>

    <!-- 'P' - Giant loop intersecting the red disc -->
    <text x="560" y="400" font-size="280" class="fill-black" letter-spacing="-0.02em">P</text>
  </g>

  <!-- PASS B: RED DISC INTERSECTION OVERLAY -->
  <g clip-path="url(#clip-red-disc)" class="font-display">
    <!-- Within the red circle, 'P' turns warm cream for radiant contrast -->
    <text x="560" y="400" font-size="280" class="fill-cream" letter-spacing="-0.02em">P</text>
  </g>

  <!-- PASS C: LOWER ZONE (Carbon Black Monolith Field) -->
  <g clip-path="url(#clip-black-zone)" class="font-display">
    <!-- 'C' - Slices into the black field, inverting to Warm Cream -->
    <text x="110" y="450" font-size="330" class="fill-cream" letter-spacing="-0.05em">C</text>

    <!-- 'A' - Slices into the black field, inverting to Warm Cream -->
    <text x="350" y="420" font-size="270" class="fill-cream" letter-spacing="-0.03em">A</text>

    <!-- 'P' - Slices into the black field, inverting to Vibrant Crimson Red -->
    <text x="560" y="400" font-size="280" class="fill-red" letter-spacing="-0.02em">P</text>

    <!-- LOWER ROW LETTERS: I - T - A - L -->
    <!-- 'I' - Monumental Crimson Red Pillar -->
    <text x="190" y="730" font-size="290" class="fill-red">I</text>

    <!-- 'T' - Bold Warm Cream Cantilever -->
    <text x="320" y="730" font-size="290" class="fill-cream">T</text>

    <!-- 'A' - Towering Warm Cream Form -->
    <text x="530" y="730" font-size="290" class="fill-cream">A</text>

    <!-- 'L' - Heavy Crimson Red Anchor -->
    <text x="750" y="730" font-size="290" class="fill-red">L</text>
  </g>

  <!-- ======================================================== -->
  <!-- 5. AUTHOR "KARL MARX" ARCHITECTURE                       -->
  <!-- ======================================================== -->

  <!-- Vertical Monumental Axis: "KARL MARX" (Rotated 90 deg along left rail) -->
  <g transform="rotate(-90 70 520)">
    <text x="-140" y="52" class="font-display fill-black" font-size="50" letter-spacing="0.32em">KARL MARX</text>
  </g>

  <!-- Horizontal Monolithic "MARX" Display Block at Lower Right Grid -->
  <g>
    <!-- Background crimson block banner -->
    <rect x="520" y="820" width="410" height="80" class="fill-red" />
    <rect x="520" y="900" width="410" height="6" class="fill-black" />

    <!-- "MARX" typography with generous tracking -->
    <text x="725" y="882" class="font-display fill-cream" font-size="62" font-weight="900" letter-spacing="0.28em" text-anchor="middle">MARX</text>
  </g>

  <!-- ======================================================== -->
  <!-- 6. ABSTRACT CONSTRUCTIVIST MOTIFS & TECHNICAL ACCENTS    -->
  <!-- ======================================================== -->

  <!-- Abstract Diagonal Speed Bars (Top Right Corner) -->
  <g class="fill-cream" opacity="0.85">
    <polygon points="860,190 950,190 930,210 840,210" />
    <polygon points="835,222 925,222 905,242 815,242" />
    <polygon points="810,254 900,254 880,274 790,274" />
  </g>

  <!-- Circular Technical Dial: The Circuit of Capital (M – C – M') -->
  <g stroke-width="1.5">
    <!-- Dial center at (130, 850) in lower-left black zone -->
    <circle cx="130" cy="850" r="36" fill="none" class="stroke-cream" opacity="0.8" />
    <circle cx="130" cy="850" r="3" class="fill-red" stroke="none" />
    <line x1="130" y1="814" x2="130" y2="824" class="stroke-cream" />
    <line x1="130" y1="876" x2="130" y2="886" class="stroke-cream" />
    <line x1="94" y1="850" x2="104" y2="850" class="stroke-cream" />
    <line x1="156" y1="850" x2="166" y2="850" class="stroke-cream" />
    <!-- 45-degree vector needle pointing to accumulation -->
    <line x1="130" y1="850" x2="155" y2="825" class="stroke-red" stroke-width="2.5" />
    <!-- Technical caption -->
    <text x="130" y="904" class="font-mono fill-cream" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.16em">FIG. 01: M – C – M'</text>
  </g>

  <!-- Technical Coordinate Label along Diagonal Axis -->
  <g transform="rotate(-14.57 500 390)">
    <text x="410" y="380" class="font-mono fill-cream" font-size="9" font-weight="600" letter-spacing="0.25em" opacity="0.75">AXIS OF CAPITAL ACCUMULATION // [C' = C + c]</text>
  </g>

  <!-- Structural Cross-Brace & Rule Annotations in Lower Black Zone -->
  <g>
    <!-- Heavy structural bar anchor -->
    <rect x="200" y="840" width="12" height="70" class="fill-cream" />
    <rect x="230" y="896" width="180" height="12" class="fill-cream" />

    <!-- Metadata text -->
    <text x="230" y="868" class="font-mono fill-cream" font-size="11" font-weight="700" letter-spacing="0.22em">HAMBURG 1867 / LONDON 1887</text>
    <text x="230" y="886" class="font-mono fill-red" font-size="9.5" font-weight="600" letter-spacing="0.18em">CRITIQUE OF POLITICAL ECONOMY</text>
  </g>

  <!-- Subtle German Archival Inscription in Top Cream Zone -->
  <g class="font-mono fill-black" opacity="0.6">
    <text x="680" y="66" font-size="9.5" font-weight="700" letter-spacing="0.24em">DAS KAPITAL · KRITIK DER POLITISCHEN OEKONOMIE</text>
  </g>

  <!-- Oversized Ghosted Watermark '01' in Upper Right -->
  <text x="960" y="130" class="font-display" font-size="120" fill="#121212" opacity="0.05" text-anchor="end">01</text>

  <!-- Outer Frame Precision Borders -->
  <rect x="0" y="0" width="1000" height="1000" fill="none" class="stroke-black" stroke-width="4" />
</svg>
